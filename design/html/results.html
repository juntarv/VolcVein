<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VolcVein — Cast Complete</title>
<style>
:root{--magma:#FF5A1F;--magma-hot:#FF8A2B;--magma-core:#FFD07A;--sulfur:#FFC21A;--sulfur-deep:#D99200;
--ink:#2B0F08;--rock-deep:#5A1E0C;--rock:#8C3410;--rock-lit:#B8471A;--ash:#F2E7D8;--ash-mid:#C9B7A4;
--ash-deep:#9A8776;--obsidian:#12383D;--obsidian-lit:#1E5A60;--danger:#C22A12;
--display:"Avenir Next Condensed","Futura",sans-serif;--body:"Avenir Next","Helvetica Neue",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--body);background:var(--rock-deep);color:var(--ash);position:relative}
.screen{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:-24px;pointer-events:none;mix-blend-mode:multiply;opacity:.22;z-index:95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");background-size:140px 140px}
.micro{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase}

/* the finished scene, dimmed behind a warm scrim */
.stage{position:absolute;inset:0;background:linear-gradient(175deg,#9A3A12 0%,#77290C 40%,#4A1508 100%)}
.stage:after{content:"";position:absolute;inset:0;
 background-image:radial-gradient(circle at 50% 50%, rgba(255,120,40,.28) 1.1px, transparent 1.35px);background-size:5px 5px}
.scrim{position:absolute;inset:0;background:rgba(43,15,8,.66);z-index:8}

.burst{position:absolute;left:60px;top:142px;width:270px;height:270px;z-index:12}
.hero{position:absolute;left:0;right:0;top:170px;text-align:center;z-index:16}

.verdict{position:absolute;left:0;right:0;top:56px;text-align:center;z-index:20}
.verdict b{display:inline-block;font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;
 letter-spacing:-.02em;text-transform:uppercase;color:var(--ash);background:var(--ink);padding:8px 20px 10px;
 transform:rotate(-2deg);box-shadow:7px 7px 0 rgba(43,15,8,.4);border-left:6px solid var(--magma)}
.verdict em{display:block;font-style:normal;margin-top:12px}
.verdict em span{background:var(--sulfur);color:var(--ink);padding:4px 12px;display:inline-block;
 transform:rotate(1.5deg);box-shadow:0 3px 0 var(--sulfur-deep)}

.stars{position:absolute;left:0;right:0;top:370px;display:flex;justify-content:center;gap:14px;z-index:22}

.nameplate{position:absolute;left:46px;right:46px;top:422px;z-index:24;background:var(--ink);
 border-bottom:4px solid var(--sulfur);padding:9px 12px 11px;text-align:center;
 box-shadow:0 5px 0 rgba(0,0,0,.4)}
.nameplate b{display:block;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;
 text-transform:uppercase;color:var(--ash)}
.nameplate i{font-style:normal;color:var(--magma-core)}

.ledger{position:absolute;left:16px;right:16px;top:492px;z-index:24;background:var(--ash);color:var(--ink);
 border-left:6px solid var(--magma);padding:7px 14px 9px;
 box-shadow:0 5px 0 rgba(43,15,8,.5),0 14px 26px rgba(43,15,8,.4)}
.ledger .r{display:flex;align-items:baseline;padding:5px 0;border-bottom:1px dashed #C9B7A4}
.ledger .r:last-child{border-bottom:0}
.ledger .r span{color:#7A4A32}
.ledger .r b{margin-left:auto;font-family:var(--display);font-weight:800;font-size:21px;line-height:1}
.ledger .r b.hot{color:var(--magma)}

.acts{position:absolute;left:16px;right:16px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:10px}
.fissure{position:relative;height:74px;filter:drop-shadow(0 8px 14px rgba(43,15,8,.55))}
.fissure .body{position:absolute;inset:0;background:linear-gradient(180deg,var(--sulfur) 0%,var(--sulfur) 60%,var(--sulfur-deep) 100%);
 clip-path:polygon(0% 24%,7% 6%,27% 14%,45% 2%,64% 11%,83% 3%,96% 13%,100% 40%,94% 74%,99% 96%,76% 88%,57% 99%,36% 90%,17% 98%,4% 80%,1% 54%)}
.fissure s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;color:var(--ink);
 text-decoration:none;text-shadow:0 2px 0 rgba(255,255,255,.32)}
.row2{display:flex;gap:10px}
.btn{flex:1;height:54px;display:flex;align-items:center;justify-content:center;gap:7px;
 background:var(--ink);color:var(--ash);border-bottom:3px solid var(--ash-deep);
 box-shadow:0 4px 0 rgba(0,0,0,.42)}
.btn b{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
</style></head>
<body><div class="screen">
  <div class="stage"></div><div class="scrim"></div>

  <svg class="burst" viewBox="0 0 320 320" width="270" height="270" data-asset="burst_cast">
    <g fill="#FFC21A" opacity=".22"><circle cx="160" cy="160" r="150"/></g>
    <g fill="#FF5A1F" opacity=".3">
      <polygon points="160,0 178,130 320,160 178,190 160,320 142,190 0,160 142,130"/>
      <polygon points="46,46 160,142 274,46 178,160 274,274 160,178 46,274 142,160" opacity=".6"/>
    </g>
  </svg>

  <div class="verdict">
    <b>Cast</b>
    <em><span class="micro">Vent 07 · Rift II · Cinder Steps</span></em>
  </div>

  <div class="hero">
    <div data-asset="cast_crownfracture_hero" style="display:inline-block">
      <svg viewBox="0 0 190 240" width="150" height="190">
        <polygon points="24,228 40,64 88,124 96,10 136,120 166,58 178,228" fill="#12383D" stroke="#2B0F08" stroke-width="6"/>
        <polygon points="96,10 136,120 166,58 178,228 96,228" fill="#1E5A60"/>
        <polygon points="96,10 108,110 96,228 84,112" fill="#79C0B8" opacity=".82"/>
        <circle cx="96" cy="176" r="10" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
        <g fill="#FFC21A"><circle cx="44" cy="150" r="4"/><circle cx="152" cy="142" r="4"/></g>
      </svg>
    </div>
  </div>

  <div class="stars" data-asset="cast_stars_row">
    <svg viewBox="0 0 48 48" width="44" height="44">
      <polygon points="24,3 30,18 46,18 33,28 38,44 24,34 10,44 15,28 2,18 18,18" fill="#FFC21A" stroke="#2B0F08" stroke-width="3.5"/></svg>
    <svg viewBox="0 0 48 48" width="44" height="44">
      <polygon points="24,3 30,18 46,18 33,28 38,44 24,34 10,44 15,28 2,18 18,18" fill="#FFC21A" stroke="#2B0F08" stroke-width="3.5"/></svg>
    <svg viewBox="0 0 48 48" width="44" height="44">
      <polygon points="24,3 30,18 46,18 33,28 38,44 24,34 10,44 15,28 2,18 18,18" fill="#4A1508" stroke="#9A8776" stroke-width="3.5"/></svg>
  </div>

  <div class="nameplate">
    <b>Crownfracture</b>
    <i class="micro">New obsidian cast · 6 of 12</i>
  </div>

  <div class="ledger">
    <div class="r"><span class="micro">Molds filled</span><b>4 / 4</b></div>
    <div class="r"><span class="micro">Yield — magma not spilled</span><b class="hot">93%</b></div>
    <div class="r"><span class="micro">Veins crusted shut</span><b>2</b></div>
    <div class="r"><span class="micro">Peak pressure</span><b>88%</b></div>
    <div class="r"><span class="micro">Cast score</span><b class="hot">1,240</b></div>
  </div>

  <div class="acts">
    <div class="fissure" data-asset="fissure_next_plate">
      <div class="body"></div><s>Next vent</s>
    </div>
    <div class="row2">
      <div class="btn"><svg viewBox="0 0 22 22" width="20" height="20"><path d="M18,11 A7,7 0 1,1 11,4 L11,1 L17,5 L11,9 L11,6" fill="none" stroke="#FFC21A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Recast</b></div>
      <div class="btn"><svg viewBox="0 0 22 22" width="20" height="20"><path d="M3,18 C8,10 14,14 19,4" fill="none" stroke="#FFC21A" stroke-width="2.6" stroke-linecap="round"/><circle cx="19" cy="4" r="3" fill="#FFC21A"/></svg><b>Rift map</b></div>
    </div>
  </div>

  <div class="grain"></div>
</div></body></html>
