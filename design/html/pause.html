<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VolcVein — Held</title>
<style>
:root{--magma:#FF5A1F;--magma-hot:#FF8A2B;--magma-core:#FFD07A;--sulfur:#FFC21A;--sulfur-deep:#D99200;
--ink:#2B0F08;--rock-deep:#5A1E0C;--rock:#8C3410;--rock-lit:#B8471A;--ash:#F2E7D8;--ash-mid:#C9B7A4;
--ash-deep:#9A8776;--obsidian:#12383D;--obsidian-lit:#1E5A60;--danger:#C22A12;
--display:"Avenir Next Condensed","Futura",sans-serif;--body:"Avenir Next","Helvetica Neue",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--body);background:var(--rock-deep);color:var(--ash);position:relative}
.screen{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:-24px;pointer-events:none;mix-blend-mode:multiply;opacity:.22;z-index:95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");background-size:140px 140px}
.micro{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase}

.stage{position:absolute;inset:0;background:linear-gradient(175deg,#9A3A12 0%,#77290C 38%,#521A08 72%,#3A1206 100%)}
.stage:after{content:"";position:absolute;inset:0;
 background-image:radial-gradient(circle at 50% 50%, rgba(255,120,40,.3) 1.1px, transparent 1.35px);background-size:5px 5px}
.scene{position:absolute;left:0;top:0;width:390px;height:844px;z-index:4;opacity:.9}
.scrim{position:absolute;inset:0;background:rgba(43,15,8,.68);z-index:10}

/* basalt slab */
.slab{position:absolute;left:22px;right:22px;top:158px;z-index:24;background:var(--ash);color:var(--ink);
 padding:0 0 20px;box-shadow:0 6px 0 rgba(43,15,8,.55),0 22px 42px rgba(43,15,8,.55);
 clip-path:polygon(0 8px,10px 0,100% 3px,calc(100% - 4px) calc(100% - 10px),96% 100%,4px calc(100% - 6px))}
.slab .cap{background:var(--ink);color:var(--ash);padding:16px 20px 14px;display:flex;align-items:flex-end;gap:10px}
.slab .cap h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:.84;letter-spacing:-.02em;
 text-transform:uppercase;color:var(--ash)}
.slab .cap h1 em{font-style:normal;color:var(--sulfur)}
.slab .cap .v{margin-left:auto;text-align:right;color:var(--ash-deep);padding-bottom:5px}
.body{padding:16px 20px 0}
.mrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.mold{flex:1;height:44px;border:3px solid var(--ink);background:#DCCBB6;position:relative;overflow:hidden}
.mold i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--magma),var(--sulfur))}
.mold.x{background:var(--obsidian);border-color:var(--obsidian)}
.mold b{position:absolute;left:5px;top:3px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink)}
.mold.x b{color:var(--ash-mid)}
.klabel{color:#7A4A32;margin-top:2px}
.gauge{margin-top:16px;padding-top:14px;border-top:2px dashed #C9B7A4}
.gauge .t{display:flex;align-items:baseline}
.gauge .t b{margin-left:auto;font-family:var(--display);font-weight:800;font-size:23px;color:var(--magma);line-height:1}
.gauge .track{height:14px;background:#DCCBB6;margin-top:7px;position:relative;border:2px solid var(--ink)}
.gauge .track i{position:absolute;left:0;top:0;bottom:0;width:58%;background:var(--magma)}
.gauge .track u{position:absolute;top:-4px;bottom:-4px;left:40%;width:35%;border:2px solid var(--sulfur-deep);
 border-left-width:3px;border-right-width:3px;background:rgba(255,194,26,.2)}

.acts{position:absolute;left:22px;right:22px;top:540px;z-index:26;display:flex;flex-direction:column;gap:11px}
.fissure{position:relative;height:78px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.fissure .bd{position:absolute;inset:0;background:linear-gradient(180deg,var(--sulfur) 0%,var(--sulfur) 60%,var(--sulfur-deep) 100%);
 clip-path:polygon(0% 24%,7% 6%,27% 14%,45% 2%,64% 11%,83% 3%,96% 13%,100% 40%,94% 74%,99% 96%,76% 88%,57% 99%,36% 90%,17% 98%,4% 80%,1% 54%)}
.fissure s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-family:var(--display);font-weight:800;font-size:36px;text-transform:uppercase;color:var(--ink);
 text-decoration:none;text-shadow:0 2px 0 rgba(255,255,255,.32)}
.btn{height:58px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);
 color:var(--ash);border-bottom:3px solid var(--ash-deep);box-shadow:0 4px 0 rgba(0,0,0,.45)}
.btn b{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.btn.quit{border-bottom-color:var(--magma)}
.tip{position:absolute;left:22px;right:22px;bottom:30px;z-index:26;text-align:center;color:var(--ash-mid)}
</style></head>
<body><div class="screen">
  <div class="stage"></div>

  <svg class="scene" viewBox="0 0 390 844" width="390" height="844">
    <ellipse cx="196" cy="742" rx="172" ry="66" fill="#8C3410"/>
    <ellipse cx="196" cy="744" rx="152" ry="52" fill="#FF7A2E"/>
    <g fill="none" stroke="#2B0F08" stroke-width="19" stroke-linecap="round">
      <path d="M196,700 C198,640 192,596 188,552"/>
      <path d="M188,552 C182,494 150,452 128,400"/>
      <path d="M188,552 C224,508 254,472 274,436"/>
      <path d="M274,436 C282,388 276,338 268,296"/>
      <path d="M274,436 C312,438 336,404 344,356"/>
    </g>
    <g fill="none" stroke="#FF5A1F" stroke-width="11" stroke-linecap="round">
      <path d="M196,700 C198,640 192,596 188,552"/>
      <path d="M188,552 C224,508 254,472 274,436"/>
      <path d="M274,436 C282,388 276,338 268,296"/>
      <path d="M274,436 C312,438 336,404 344,356"/>
    </g>
    <g fill="none" stroke="#8C3410" stroke-width="11" stroke-linecap="round">
      <path d="M188,552 C182,494 150,452 128,400"/>
    </g>
    <polygon points="188,530 206,540 206,562 188,572 170,562 170,540" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
    <polygon points="274,414 292,424 292,446 274,456 256,446 256,424" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
  </svg>

  <div class="scrim"></div>

  <div class="slab">
    <div class="cap">
      <h1>Held<em>.</em></h1>
      <div class="v micro">Vent 07 · Rift II</div>
    </div>
    <div class="body">
      <div class="klabel micro">Rim molds</div>
      <div class="mrow" data-asset="mold_row">
        <div class="mold"><i style="height:100%"></i><b>1</b></div>
        <div class="mold"><i style="height:62%"></i><b>2</b></div>
        <div class="mold"><i style="height:25%"></i><b>3</b></div>
        <div class="mold x"><b>4</b></div>
      </div>
      <div class="gauge">
        <div class="t"><span class="micro">Chamber pressure</span><b>58%</b></div>
        <div class="track"><u></u><i></i></div>
        <div class="klabel micro" style="margin-top:7px">Safe band 40–75% · redline at 95%</div>
      </div>
    </div>
  </div>

  <div class="acts">
    <div class="fissure" data-asset="fissure_resume_plate"><div class="bd"></div><s>Resume</s></div>
    <div class="btn"><svg viewBox="0 0 22 22" width="20" height="20"><path d="M18,11 A7,7 0 1,1 11,4 L11,1 L17,5 L11,9 L11,6" fill="none" stroke="#FFC21A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Restart vent</b></div>
    <div class="btn quit"><svg viewBox="0 0 22 22" width="20" height="20"><path d="M4,19 L11,3 L18,19 Z" fill="none" stroke="#FF5A1F" stroke-width="2.6" stroke-linejoin="round"/></svg><b>Leave to caldera</b></div>
  </div>

  <div class="tip micro">Progress on this vent is kept until you leave</div>

  <div class="grain"></div>
</div></body></html>
