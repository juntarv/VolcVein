<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VolcVein — Caldera</title>
<style>
:root{
 --magma:#FF5A1F;--magma-hot:#FF8A2B;--magma-core:#FFD07A;
 --sulfur:#FFC21A;--sulfur-deep:#D99200;
 --ink:#2B0F08;--rock-deep:#5A1E0C;--rock:#8C3410;--rock-lit:#B8471A;
 --ash:#F2E7D8;--ash-mid:#C9B7A4;--ash-deep:#9A8776;
 --obsidian:#12383D;--obsidian-lit:#1E5A60;--danger:#C22A12;
 --display:"Avenir Next Condensed","Futura",sans-serif;
 --body:"Avenir Next","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--body);background:var(--rock-deep);color:var(--ash);position:relative}
.screen{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:-24px;pointer-events:none;mix-blend-mode:multiply;opacity:.22;z-index:95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
 background-size:140px 140px}
.micro{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}

.sky{position:absolute;left:0;right:0;top:0;height:300px;
 background:linear-gradient(178deg,#FFF0C6 0%,#FFD089 30%,#FFA95A 62%,#FF8438 100%)}
.sky-ht{position:absolute;left:0;right:0;top:0;height:300px;color:rgba(196,58,10,.4);
 background-image:radial-gradient(circle at 50% 50%, currentColor 1.05px, transparent 1.3px);
 background-size:5px 5px;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.9) 72%,#000 100%)}
.sun{position:absolute;right:26px;top:36px;width:78px;height:78px;border-radius:50%;
 background:#FFF6D8;box-shadow:0 0 0 9px rgba(255,246,216,.32),0 0 0 22px rgba(255,246,216,.14)}
.plume{position:absolute;left:70px;top:4px;width:250px;height:262px;z-index:4}
.mtn{position:absolute;left:0;top:146px;width:390px;height:698px;z-index:5}

.logo{position:absolute;left:14px;top:66px;z-index:30;transform:rotate(-4.5deg);
 padding:12px 18px 13px;background:var(--ink);border-left:6px solid var(--magma);
 box-shadow:8px 8px 0 rgba(43,15,8,.3),0 16px 28px rgba(43,15,8,.38)}
.logo b{display:block;font-family:var(--display);font-weight:800;font-size:58px;line-height:.84;
 letter-spacing:-.025em;text-transform:uppercase;color:var(--ash);text-shadow:3px 3px 0 rgba(255,90,31,.9)}
.logo b.two{color:var(--sulfur)}
.logo .tag{display:block;margin-top:8px;color:var(--magma-core)}

.fissure{position:absolute;left:52px;top:592px;width:286px;height:100px;z-index:40;
 transform:rotate(-3deg);filter:drop-shadow(0 12px 20px rgba(43,15,8,.6))}
.fissure .body{position:absolute;inset:0;
 background:linear-gradient(180deg,var(--sulfur) 0%,var(--sulfur) 60%,var(--sulfur-deep) 100%);
 clip-path:polygon(0% 26%,7% 7%,26% 15%,44% 2%,63% 11%,82% 3%,96% 14%,100% 40%,94% 74%,99% 96%,76% 88%,57% 99%,36% 90%,17% 98%,4% 80%,1% 54%)}
.fissure .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.fissure .lbl s{font-family:var(--display);font-weight:800;font-size:42px;line-height:.92;letter-spacing:.02em;
 text-transform:uppercase;color:var(--ink);text-decoration:none;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.fissure .lbl em{font-style:normal;color:#6B2A05;font-family:var(--display);font-weight:800;
 font-size:11px;letter-spacing:.2em;text-transform:uppercase}

.nav{position:absolute;z-index:38;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav .cap{background:var(--ink);color:var(--ash);padding:4px 9px;box-shadow:0 3px 0 rgba(43,15,8,.5);
 border-bottom:2px solid var(--magma)}
.nav-cast{left:8px;top:316px}
.nav-marks{right:6px;top:258px}
.nav-valve{right:18px;top:698px}

.stat-wall{position:absolute;left:14px;bottom:18px;width:206px;z-index:45;
 background:rgba(28,9,4,.92);border-left:5px solid var(--magma);padding:10px 14px 12px;
 box-shadow:0 4px 0 rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.5)}
.stat-wall .k{color:var(--ash-deep)}
.stat-wall .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:.92;
 color:var(--sulfur);letter-spacing:-.01em}
.stat-wall .row{display:flex;gap:17px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(242,231,216,.22)}
.stat-wall .row span{display:block;font-family:var(--display);font-weight:800;font-size:21px;color:var(--ash);line-height:1}
</style></head>
