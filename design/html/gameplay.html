<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VolcVein — Vent 07</title>
<style>
:root{--magma:#FF5A1F;--magma-hot:#FF8A2B;--magma-core:#FFD07A;--sulfur:#FFC21A;--sulfur-deep:#D99200;
--ink:#2B0F08;--rock-deep:#5A1E0C;--rock:#8C3410;--rock-lit:#B8471A;--ash:#F2E7D8;--ash-mid:#C9B7A4;
--ash-deep:#9A8776;--obsidian:#12383D;--obsidian-lit:#1E5A60;--danger:#C22A12;
--display:"Avenir Next Condensed","Futura",sans-serif;--body:"Avenir Next","Helvetica Neue",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--body);background:var(--rock-deep);color:var(--ash);position:relative}
.screen{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:-24px;pointer-events:none;mix-blend-mode:multiply;opacity:.22;z-index:95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");background-size:140px 140px}
.micro{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.num{font-family:var(--display);font-weight:800;letter-spacing:-.01em;line-height:1}

/* ---- SKScene ---- */
.stage{position:absolute;inset:0;background:linear-gradient(175deg,#9A3A12 0%,#77290C 38%,#521A08 72%,#3A1206 100%)}
.stage:after{content:"";position:absolute;inset:0;
 background-image:radial-gradient(circle at 50% 50%, rgba(255,120,40,.3) 1.1px, transparent 1.35px);background-size:5px 5px}
.scene{position:absolute;left:0;top:0;width:390px;height:844px;z-index:4}

/* ---- HUD (SwiftUI overlay) ---- */
.hud-top{position:absolute;left:12px;right:12px;top:52px;height:58px;z-index:60;display:flex;align-items:stretch;gap:8px}
.pausebtn{width:52px;background:var(--ink);border-bottom:3px solid var(--sulfur);
 display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.hud-card{flex:1;background:var(--ash);color:var(--ink);display:flex;align-items:center;
 padding:0 12px;gap:10px;box-shadow:0 4px 0 rgba(43,15,8,.45),0 10px 18px rgba(43,15,8,.35);
 border-left:5px solid var(--magma)}
.hud-card .lv{line-height:1.05;flex:none;white-space:nowrap}
.hud-card .lv b{display:block;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.hud-card .lv i{font-style:normal;color:#7A4A32;font-family:var(--display);font-weight:800;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.hud-card .sc{text-align:right;flex:none}
.hud-card .sc b{display:block;font-family:var(--display);font-weight:800;font-size:30px;color:var(--magma);line-height:.95}
.hud-card .sc i{font-style:normal;color:#7A4A32;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.molds{display:flex;gap:4px;align-items:center;margin-left:auto;padding:0 10px;border-left:2px dashed #C9B7A4;border-right:2px dashed #C9B7A4}
.mchip{width:13px;height:18px;border:2px solid var(--ink);background:#DCCBB6}
.mchip.f{background:var(--sulfur)}
.mchip.p{background:linear-gradient(0deg,var(--sulfur) 55%,#DCCBB6 55%)}
.mchip.x{background:var(--obsidian)}

/* ---- pressure column ---- */
.press{position:absolute;left:10px;top:146px;width:46px;height:410px;z-index:58}
.press .cap{position:absolute;left:0;right:0;top:-19px;text-align:center;color:var(--ash);opacity:.9}
.press .val{position:absolute;left:0;right:0;bottom:-30px;text-align:center;
 font-family:var(--display);font-weight:800;font-size:20px;color:var(--sulfur);
 text-shadow:0 2px 0 rgba(43,15,8,.9)}

/* ---- bottom hint ---- */
.hint{position:absolute;left:12px;right:12px;bottom:26px;z-index:60;background:rgba(28,9,4,.9);
 border-left:4px solid var(--sulfur);padding:9px 12px;display:flex;gap:10px;align-items:center;
 box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hint span{color:var(--ash);opacity:.95}
.hint em{font-style:normal;color:var(--sulfur)}

/* ---- surge flash (juice) ---- */
.flash{position:absolute;left:236px;top:196px;width:120px;height:120px;z-index:50;pointer-events:none}
</style></head>
<body><div class="screen">
  <div class="stage"></div>

  <!-- ===== SKScene: the vein network ===== -->
  <svg class="scene" viewBox="0 0 390 844" width="390" height="844">
    <defs>
      <linearGradient id="chamber" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE2A6"/><stop offset=".38" stop-color="#FF7A2E"/><stop offset="1" stop-color="#A83B12"/>
      </linearGradient>
      <linearGradient id="moldfill" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FFC21A"/>
      </linearGradient>
    </defs>

    <!-- strata (background layer, z -100) -->
    <g stroke="#B8471A" stroke-width="3" fill="none" opacity=".26">
      <path d="M-10,258 C80,238 150,250 220,230 C290,210 340,228 400,248"/>
      <path d="M-10,376 C80,356 150,368 220,348 C290,328 340,346 400,366"/>
      <path d="M-10,494 C80,474 150,486 220,466 C290,446 340,464 400,484"/>
      <path d="M-10,612 C80,592 150,604 220,584 C290,564 340,582 400,602"/>
    </g>

    <!-- crater rim shelf -->
    <path d="M-10,214 C60,196 110,206 160,190 C214,172 268,186 320,168 C350,158 380,164 400,158 L400,120 L-10,120 Z"
          fill="#3A1206" opacity=".55"/>

    <!-- ===== magma chamber ===== -->
    <ellipse cx="196" cy="742" rx="172" ry="66" fill="#8C3410"/>
    <ellipse cx="196" cy="744" rx="152" ry="52" fill="url(#chamber)"/>
    <ellipse cx="196" cy="732" rx="104" ry="26" fill="#FFE2A6" opacity=".8"/>
    <g fill="#FFF6D8" opacity=".9"><circle cx="140" cy="734" r="4"/><circle cx="248" cy="740" r="3.5"/><circle cx="196" cy="722" r="3"/></g>

    <!-- ===== vein casings (game entities, z 0) ===== -->
    <g fill="none" stroke="#2B0F08" stroke-width="19" stroke-linecap="round">
      <path d="M196,700 C198,640 192,596 188,552"/>
      <path d="M188,552 C182,494 150,452 128,400"/>
      <path d="M188,552 C224,508 254,472 274,436"/>
      <path d="M128,400 C120,354 126,318 126,282"/>
      <path d="M274,436 C282,388 276,338 268,296"/>
      <path d="M274,436 C312,438 336,404 344,356"/>
      <path d="M188,552 C150,558 118,548 92,522"/>
    </g>
    <!-- hot flow -->
    <g fill="none" stroke="#FF5A1F" stroke-width="11" stroke-linecap="round">
      <path d="M196,700 C198,640 192,596 188,552"/>
      <path d="M188,552 C224,508 254,472 274,436"/>
      <path d="M274,436 C282,388 276,338 268,296"/>
      <path d="M274,436 C312,438 336,404 344,356"/>
    </g>
    <g fill="none" stroke="#FFE2A6" stroke-width="3.4" stroke-linecap="round" opacity=".95">
      <path d="M196,700 C198,640 192,596 188,552"/>
      <path d="M188,552 C224,508 254,472 274,436"/>
      <path d="M274,436 C282,388 276,338 268,296"/>
      <path d="M274,436 C312,438 336,404 344,356"/>
    </g>
    <!-- shut branch: cooling, still warm -->
    <g fill="none" stroke="#8C3410" stroke-width="11" stroke-linecap="round">
      <path d="M188,552 C182,494 150,452 128,400"/>
      <path d="M128,400 C120,354 126,318 126,282"/>
    </g>
    <!-- crusted branch (cooled state ink) -->
    <path d="M188,552 C150,558 118,548 92,522" fill="none" stroke="#12383D" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="13 9"/>

    <!-- flow direction ticks -->
    <g fill="#FFF6D8" opacity=".95">
      <circle cx="193" cy="662" r="3.5"/><circle cx="190" cy="606" r="3"/>
      <circle cx="232" cy="500" r="3.5"/><circle cx="264" cy="452" r="3"/>
      <circle cx="279" cy="376" r="3.5"/><circle cx="320" cy="424" r="3"/>
    </g>

    <!-- ===== valves ===== -->
    <!-- OPEN junction valve -->
    <g>
      <polygon points="188,530 206,540 206,562 188,572 170,562 170,540" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
      <circle cx="188" cy="551" r="7" fill="#FF5A1F" stroke="#2B0F08" stroke-width="3"/>
    </g>
    <!-- OPEN junction valve -->
    <g>
      <polygon points="274,414 292,424 292,446 274,456 256,446 256,424" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
      <circle cx="274" cy="435" r="7" fill="#FF5A1F" stroke="#2B0F08" stroke-width="3"/>
    </g>
    <!-- SHUT valve (basalt plug + bar) -->
    <g>
      <polygon points="128,378 146,388 146,410 128,420 110,410 110,388" fill="#9A8776" stroke="#2B0F08" stroke-width="4"/>
      <path d="M113,399 L143,399" stroke="#2B0F08" stroke-width="7" stroke-linecap="round"/>
      <path d="M113,399 L143,399" stroke="#F2E7D8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- CRUSTED valve -->
    <g>
      <polygon points="140,534 156,543 156,561 140,570 124,561 124,543" fill="#12383D" stroke="#C9B7A4" stroke-width="3.5"/>
      <path d="M131,546 L149,558 M149,546 L131,558" stroke="#C9B7A4" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ===== rim vents + molds ===== -->
    <!-- mold A : FULL -->
    <g>
      <polygon points="88,248 164,248 154,300 98,300" fill="#4A1508" stroke="#2B0F08" stroke-width="4"/>
      <polygon points="95,256 157,256 149,294 103,294" fill="#12383D"/>
      <polygon points="109,258 143,258 136,292 116,292" fill="#1E5A60"/>
      <polygon points="126,258 133,272 126,292 119,272" fill="#6FB5AE" opacity=".8"/>
      <circle cx="126" cy="240" r="13" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
      <path d="M120,240 L125,246 L133,234" stroke="#2B0F08" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- mold B : 65% -->
    <g>
      <polygon points="230,250 306,250 296,302 240,302" fill="#4A1508" stroke="#2B0F08" stroke-width="4"/>
      <polygon points="237,276 299,276 291,296 245,296" fill="url(#moldfill)"/>
      <polygon points="237,276 299,276 299,281 237,281" fill="#FFE2A6" opacity=".8"/>
      <circle cx="268" cy="242" r="13" fill="#FF5A1F" stroke="#2B0F08" stroke-width="4"/>
      <text x="268" y="248" font-family="Avenir Next Condensed" font-weight="800" font-size="15" fill="#2B0F08" text-anchor="middle">2</text>
    </g>
    <!-- mold C : 25% -->
    <g>
      <polygon points="306,310 378,310 368,360 316,360" fill="#4A1508" stroke="#2B0F08" stroke-width="4"/>
      <polygon points="318,346 368,346 362,354 322,354" fill="url(#moldfill)"/>
      <circle cx="342" cy="302" r="13" fill="#FF5A1F" stroke="#2B0F08" stroke-width="4"/>
      <text x="342" y="308" font-family="Avenir Next Condensed" font-weight="800" font-size="15" fill="#2B0F08" text-anchor="middle">3</text>
    </g>
    <!-- mold D : starved, its feed is shut -->
    <g opacity=".95">
      <polygon points="90,196 162,196 152,246 100,246" fill="#3A1206" stroke="#2B0F08" stroke-width="4" transform="translate(0,-24)"/>
      <circle cx="126" cy="156" r="13" fill="#9A8776" stroke="#2B0F08" stroke-width="4"/>
      <text x="126" y="162" font-family="Avenir Next Condensed" font-weight="800" font-size="15" fill="#2B0F08" text-anchor="middle">4</text>
    </g>

    <!-- ===== effects layer (z 50): a gout landing in mold B ===== -->
    <g>
      <ellipse cx="272" cy="330" rx="13" ry="17" fill="#FFE2A6"/>
      <ellipse cx="272" cy="330" rx="8" ry="11" fill="#FFF6D8"/>
      <g fill="#FFC21A"><circle cx="252" cy="312" r="4"/><circle cx="292" cy="318" r="3.5"/>
        <circle cx="262" cy="352" r="3"/><circle cx="288" cy="348" r="4"/><circle cx="304" cy="330" r="2.5"/></g>
    </g>
  </svg>

  <!-- burst flash -->
  <svg class="flash" viewBox="0 0 120 120" width="120" height="120">
    <g fill="#FFC21A" opacity=".5">
      <polygon points="60,0 68,44 112,52 68,60 60,120 52,60 8,52 52,44"/>
    </g>
  </svg>

  <!-- ===== HUD ===== -->
  <div class="hud-top">
    <div class="pausebtn" data-asset="btn_pause_valve">
      <svg viewBox="0 0 30 30" width="30" height="30">
        <rect x="4" y="4" width="9" height="22" fill="#FFC21A" stroke="#F2E7D8" stroke-width="2"/>
        <rect x="17" y="4" width="9" height="22" fill="#FFC21A" stroke="#F2E7D8" stroke-width="2"/>
      </svg>
    </div>
    <div class="hud-card">
      <div class="lv"><b>Vent 07</b><i>Rift II · Cinder</i></div>
      <div class="molds" title="molds">
        <div class="mchip f"></div><div class="mchip p"></div><div class="mchip" style="background:linear-gradient(0deg,var(--sulfur) 25%,#DCCBB6 25%)"></div><div class="mchip x"></div>
      </div>
      <div class="sc"><b>1,240</b><i>Cast</i></div>
    </div>
  </div>

  <!-- pressure column -->
  <div class="press">
    <div class="cap micro">Pressure</div>
    <svg viewBox="0 0 46 430" width="46" height="410" data-asset="gauge_pressure_column">
      <rect x="7" y="0" width="32" height="430" fill="#2B0F08"/>
      <rect x="11" y="4" width="24" height="422" fill="#3A1206"/>
      <!-- redline zone -->
      <rect x="11" y="4" width="24" height="74" fill="#C22A12" opacity=".55"/>
      <g stroke="#F2E7D8" stroke-width="2" opacity=".5">
        <path d="M11,78 L35,78"/><path d="M11,180 L35,180"/><path d="M11,286 L35,286"/>
      </g>
      <!-- fill -->
      <rect x="11" y="176" width="24" height="250" fill="#FF5A1F"/>
      <rect x="11" y="176" width="24" height="10" fill="#FFE2A6"/>
      <!-- safe band bracket -->
      <g stroke="#FFC21A" stroke-width="4" fill="none">
        <path d="M2,132 L2,268"/><path d="M2,132 L10,132"/><path d="M2,268 L10,268"/>
      </g>
      <g stroke="#FFC21A" stroke-width="4" fill="none">
        <path d="M44,132 L44,268"/><path d="M36,132 L44,132"/><path d="M36,268 L44,268"/>
      </g>
      <!-- needle -->
      <polygon points="39,176 52,168 52,184" fill="#FFC21A" stroke="#2B0F08" stroke-width="2.5"/>
      <rect x="7" y="0" width="32" height="430" fill="none" stroke="#F2E7D8" stroke-width="2.5" opacity=".6"/>
    </svg>
    <div class="val">58%</div>
  </div>

  <div class="hint">
    <svg viewBox="0 0 26 26" width="26" height="26" style="flex:none">
      <polygon points="13,2 24,8 24,19 13,25 2,19 2,8" fill="#FFC21A" stroke="#2B0F08" stroke-width="2.5"/>
      <circle cx="13" cy="13.5" r="4.5" fill="#FF5A1F" stroke="#2B0F08" stroke-width="2"/>
    </svg>
    <span class="micro">Tap a valve to <em>shut</em> it · hold to <em>blow a crust</em></span>
  </div>

  <div class="grain"></div>
</div></body></html>
