<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VolcVein — Onboarding 1</title>
<style>
:root{--magma:#FF5A1F;--magma-hot:#FF8A2B;--magma-core:#FFD07A;--sulfur:#FFC21A;--sulfur-deep:#D99200;
--ink:#2B0F08;--rock-deep:#5A1E0C;--rock:#8C3410;--rock-lit:#B8471A;--ash:#F2E7D8;--ash-mid:#C9B7A4;
--ash-deep:#9A8776;--obsidian:#12383D;--obsidian-lit:#1E5A60;--danger:#C22A12;
--display:"Avenir Next Condensed","Futura",sans-serif;--body:"Avenir Next","Helvetica Neue",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--body);background:var(--rock-deep);color:var(--ash);position:relative}
.screen{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:-24px;pointer-events:none;mix-blend-mode:multiply;opacity:.22;z-index:95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");background-size:140px 140px}
.micro{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}

.sky{position:absolute;left:0;right:0;top:0;height:430px;
 background:linear-gradient(178deg,#FFF0C6 0%,#FFCB80 32%,#FF9F50 64%,#F4712C 100%)}
.sky:after{content:"";position:absolute;inset:0;
 background-image:radial-gradient(circle at 50% 50%, rgba(196,58,10,.4) 1.05px, transparent 1.3px);
 background-size:5px 5px;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.9) 66%,#000 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:424px;
 background:linear-gradient(178deg,#C9531F 0%,#8C3410 34%,#5A1E0C 72%,#3A1206 100%)}
.ground:after{content:"";position:absolute;inset:0;
 background-image:radial-gradient(circle at 50% 50%, rgba(255,120,40,.26) 1.1px, transparent 1.35px);background-size:5px 5px}

.art{position:absolute;left:0;top:170px;width:390px;height:400px;z-index:6}

.logo{position:absolute;left:0;right:0;top:52px;z-index:30;text-align:center}
.logo b{display:inline-block;font-family:var(--display);font-weight:800;font-size:66px;line-height:.84;
 letter-spacing:-.03em;text-transform:uppercase;color:var(--ash);background:var(--ink);
 padding:10px 22px 12px;transform:rotate(-2deg);border-left:7px solid var(--magma);
 box-shadow:9px 9px 0 rgba(43,15,8,.34),0 18px 32px rgba(43,15,8,.4)}
.logo b em{font-style:normal;color:var(--sulfur)}

.copy{position:absolute;left:20px;right:20px;top:500px;z-index:34;background:var(--ash);color:var(--ink);
 border-left:6px solid var(--sulfur);padding:15px 17px 17px;
 box-shadow:0 5px 0 rgba(43,15,8,.5),0 18px 32px rgba(43,15,8,.45)}
.copy h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:.98;text-transform:uppercase;letter-spacing:-.01em}
.copy p{font-size:14px;color:#6B4030;margin-top:8px;line-height:1.42}
.copy p b{color:var(--ink);font-weight:600}

.pager{position:absolute;left:0;right:0;top:700px;z-index:34;display:flex;justify-content:center;gap:8px}
.pager i{width:26px;height:6px;background:rgba(242,231,216,.32)}
.pager i.on{background:var(--sulfur);width:44px}

.fissure{position:absolute;left:20px;right:20px;top:724px;height:82px;z-index:34;
 filter:drop-shadow(0 10px 18px rgba(43,15,8,.6))}
.fissure .bd{position:absolute;inset:0;background:linear-gradient(180deg,var(--sulfur) 0%,var(--sulfur) 60%,var(--sulfur-deep) 100%);
 clip-path:polygon(0% 24%,7% 6%,27% 14%,45% 2%,64% 11%,83% 3%,96% 13%,100% 40%,94% 74%,99% 96%,76% 88%,57% 99%,36% 90%,17% 98%,4% 80%,1% 54%)}
.fissure s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
 font-family:var(--display);font-weight:800;font-size:36px;text-transform:uppercase;color:var(--ink);
 text-decoration:none;text-shadow:0 2px 0 rgba(255,255,255,.32)}
.skip{position:absolute;right:16px;top:56px;z-index:36;background:rgba(43,15,8,.8);color:var(--ash);padding:9px 13px}
</style></head>
<body><div class="screen">
  <div class="sky"></div><div class="ground"></div>

  <svg class="art" viewBox="0 0 390 440" width="390" height="400" data-asset="onboard_hero_volcano">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E0621F"/><stop offset=".45" stop-color="#A83B12"/><stop offset="1" stop-color="#5A1E0C"/>
      </linearGradient>
    </defs>
    <path d="M-10,440 L-10,282 L52,230 L110,178 L156,126 L186,92 L200,80 L212,92 L242,126 L288,178 L346,230 L400,282 L400,440 Z"
          fill="url(#g1)"/>
    <path d="M-10,282 L52,230 L110,178 L156,126 L186,92 L200,80 L212,92 L242,126 L288,178 L346,230 L400,282"
          fill="none" stroke="#FFC21A" stroke-width="3.5" opacity=".82"/>
    <ellipse cx="200" cy="412" rx="150" ry="48" fill="#8C3410"/>
    <ellipse cx="200" cy="414" rx="128" ry="36" fill="#FF7A2E"/>
    <ellipse cx="200" cy="406" rx="88" ry="20" fill="#FFE2A6" opacity=".82"/>

    <g fill="none" stroke="#2B0F08" stroke-width="18" stroke-linecap="round">
      <path d="M200,392 C202,344 194,310 190,276"/>
      <path d="M190,276 C178,230 142,198 118,160"/>
      <path d="M190,276 C220,238 248,208 268,172"/>
      <path d="M190,276 C154,286 124,272 100,242"/>
    </g>
    <g fill="none" stroke="#FF5A1F" stroke-width="10" stroke-linecap="round">
      <path d="M200,392 C202,344 194,310 190,276"/>
      <path d="M190,276 C178,230 142,198 118,160"/>
      <path d="M190,276 C220,238 248,208 268,172"/>
    </g>
    <g fill="none" stroke="#FFE2A6" stroke-width="3" stroke-linecap="round" opacity=".92">
      <path d="M200,392 C202,344 194,310 190,276"/>
      <path d="M190,276 C178,230 142,198 118,160"/>
      <path d="M190,276 C220,238 248,208 268,172"/>
    </g>
    <path d="M190,276 C154,286 124,272 100,242" fill="none" stroke="#12383D" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="12 8"/>

    <polygon points="190,262 206,271 206,289 190,298 174,289 174,271" fill="#FFC21A" stroke="#2B0F08" stroke-width="4"/>
    <circle cx="190" cy="280" r="6.5" fill="#FF5A1F" stroke="#2B0F08" stroke-width="3"/>
    <g stroke="#2B0F08" stroke-width="4">
      <circle cx="117" cy="157" r="13" fill="#FFC21A"/>
      <circle cx="269" cy="169" r="13" fill="#FFC21A"/>
      <circle cx="98" cy="240" r="13" fill="#12383D" stroke="#C9B7A4"/>
    </g>
    <g fill="#FF5A1F"><circle cx="117" cy="157" r="5"/><circle cx="269" cy="169" r="5"/></g>
    <path d="M89,231 L107,249 M107,231 L89,249" stroke="#C9B7A4" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#FFC21A" opacity=".9">
      <circle cx="144" cy="128" r="3"/><circle cx="292" cy="140" r="2.5"/><circle cx="86" cy="188" r="2.5"/>
      <circle cx="310" cy="216" r="3"/>
    </g>
  </svg>

  <div class="logo" data-asset="logo_volcvein_stacked"><b>Volc<br><em>Vein</em></b></div>
  <div class="skip micro">Skip</div>

  <div class="copy">
    <h2>A mountain you steer<br>by closing doors</h2>
    <p>Magma climbs a branching vein network toward the rim. You cannot push it, aim it, or pour it. <b>You can only shut branches</b> — and everything you shut starts to cool.</p>
  </div>

  <div class="pager"><i class="on"></i><i></i></div>

  <div class="fissure"><div class="bd"></div><s>Go on</s></div>

  <div class="grain"></div>
</div></body></html>
